version: '3.8'

services:
  loveever-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loveever-backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      # 挂载本地持久化数据库与文件上传目录
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - GIN_MODE=release
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/auth/login"]
      interval: 30s
      timeout: 5s
      retries: 3
