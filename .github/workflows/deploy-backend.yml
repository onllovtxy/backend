name: 🚀 Self-Hosted 自动部署 Go 后端到云服务器

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. 拉取仓库最新代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 使用服务器本地现成的 Go 1.22 编译环境直接秒级打包
      - name: Build Go Binary
        run: |
          export PATH=$PATH:/usr/bin:/usr/local/bin:/usr/local/go/bin
          cd backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o loveever-server main.go

      # 3. 部署二进制文件与资源到运行目录并重启服务
      - name: Deploy and Restart Service
        run: |
          mkdir -p /www/loveever/backend/data /www/loveever/backend/uploads
          cp backend/loveever-server /www/loveever/backend/loveever-server
          sudo systemctl restart loveever-backend || sudo systemctl start loveever-backend
          echo "✅ Self-Hosted 部署成功！"
